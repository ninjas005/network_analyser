name: Release

# Push a tag like v0.1.0 (must match Cargo.toml's version) to build every
# platform and publish a GitHub Release. Manual runs build the artifacts
# without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP: network_analyser

jobs:
  oui:
    name: Refresh MAC vendor list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Output is the compact "PREFIX Vendor" format. IEEE often blocks CI
      # runners (HTTP 418), so try IEEE, then Wireshark's manuf mirror, and
      # fall back to the copy committed in assets/oui.txt.
      - name: Build oui.txt
        run: |
          set -uo pipefail
          min=20000
          if curl -fsSL --retry 2 -A "Mozilla/5.0" -o ieee.txt https://standards-oui.ieee.org/oui/oui.txt; then
            grep "(base 16)" ieee.txt | tr -d '\r' \
              | sed -E 's/^([0-9A-Fa-f]{6})[[:space:]]+\(base 16\)[[:space:]]+(.*)$/\1 \2/' \
              | sort -u > fresh.txt
          fi
          if [ "$(wc -l < fresh.txt 2>/dev/null || echo 0)" -lt $min ] \
             && curl -fsSL --retry 2 -o manuf.txt https://www.wireshark.org/download/automated/data/manuf; then
            # "00:00:0C<TAB>Cisco<TAB>Cisco Systems, Inc" (skip /28, /36 blocks)
            grep -E '^[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}[[:space:]]' manuf.txt \
              | awk -F'\t' '{p=toupper($1); gsub(/[: \t]/,"",p); v=($3!=""?$3:$2); print p" "v}' \
              | sort -u > fresh.txt
          fi
          n=$(wc -l < fresh.txt 2>/dev/null || echo 0)
          if [ "$n" -ge $min ]; then
            cp fresh.txt oui.txt; echo "Using freshly downloaded list ($n entries)"
          else
            cp assets/oui.txt oui.txt; echo "::warning::Download failed; using committed assets/oui.txt ($(wc -l < oui.txt) entries)"
          fi
          test "$(wc -l < oui.txt)" -ge $min
      - uses: actions/upload-artifact@v4
        with:
          name: oui
          path: oui.txt

  version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  linux:
    name: Linux x86_64 (deb, rpm, tar.gz)
    needs: [oui, version]
    # Oldest supported runner => broadest glibc compatibility (2.35+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: oui, path: assets }
      - uses: dtolnay/rust-toolchain@stable
      - run: ./.github/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - name: Install packagers
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          v=${{ needs.version.outputs.version }}
          mkdir -p dist
          cargo deb --no-build --no-strip -o dist/network-analyser_${v}_amd64.deb
          cargo generate-rpm -o dist/network-analyser-${v}-1.x86_64.rpm
          root=network-analyser-${v}-linux-x86_64
          mkdir -p $root/bin $root/share/network-analyser $root/share/applications $root/share/icons/hicolor/512x512/apps
          cp target/release/$APP $root/bin/
          cp assets/oui.txt $root/share/network-analyser/
          cp assets/network-analyser.desktop $root/share/applications/
          cp assets/icon-512.png $root/share/icons/hicolor/512x512/apps/network-analyser.png
          cp README.md LICENSE $root/
          tar czf dist/$root.tar.gz $root
          dpkg-deb --info dist/*.deb | sed -n '/Depends/p'
          ls -la dist
      - name: Smoke test (headless CLI)
        run: ./target/release/$APP --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  macos:
    name: macOS universal (.dmg)
    needs: [oui, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: oui, path: assets }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (arm64 + x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle .app and .dmg
        run: |
          set -euo pipefail
          v=${{ needs.version.outputs.version }}
          app="dist/Network Analyser.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/$APP" \
            target/aarch64-apple-darwin/release/$APP target/x86_64-apple-darwin/release/$APP
          cp assets/oui.txt "$app/Contents/Resources/"
          # Icon
          iconset=AppIcon.iconset; mkdir -p $iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-1024.png --out $iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d assets/icon-1024.png --out $iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $iconset -o "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Network Analyser</string>
            <key>CFBundleDisplayName</key><string>Network Analyser</string>
            <key>CFBundleIdentifier</key><string>io.github.ninjas005.network-analyser</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleExecutable</key><string>$APP</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>Network Analyser scans your local network to list devices and their open services.</string>
            <key>NSBonjourServices</key><array><string>_services._dns-sd._udp</string></array>
          </dict></plist>
          EOF
          # Ad-hoc signature (no Apple Developer ID): see README for first launch.
          codesign --force --deep --sign - "$app"
          ln -s /Applications dist/Applications
          hdiutil create -volname "Network Analyser" -srcfolder dist -ov -format UDZO \
            "network-analyser-${v}-macos-universal.dmg"
          mkdir -p out && mv network-analyser-*.dmg out/
          lipo -info "$app/Contents/MacOS/$APP"
      - name: Smoke test (headless CLI)
        run: '"dist/Network Analyser.app/Contents/MacOS/$APP" --help'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: out/*

  windows:
    name: Windows x86_64 (.zip)
    needs: [oui, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: oui, path: assets }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $root = "network-analyser-$v-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $root, out | Out-Null
          Copy-Item "target/release/$env:APP.exe" $root/
          Copy-Item assets/oui.txt, README.md, LICENSE $root/
          Compress-Archive -Path $root -DestinationPath "out/$root.zip"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: out/*

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Network Analyser $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag

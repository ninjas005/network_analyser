[package]
name = "network_analyser"
version = "1.3.0"
edition = "2024"
description = "LAN scanner, remote port scanner, packet capture/analyser, serial monitor and Modbus RTU/TCP tool"
license = "MIT"
repository = "https://github.com/ninjas005/network_analyser"
readme = "README.md"
authors = ["Vivek Vijayan"]
build = "build.rs"

[dependencies]
base64 = "0.22.1"
dns-lookup = "4.0.2"
futures = "0.3.34"
# Linux: both the X11 and the Wayland backend are compiled in; the backend is
# picked at runtime (WAYLAND_DISPLAY -> Wayland, else X11; see --x11/--wayland).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest"] }
if-addrs = "0.15.0"
libc = "=0.2.186"
pcap = "2"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "4.0.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4", default-features = false }
sha2 = "0.10.9"
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "time", "process", "sync", "io-util", "macros"] }
x509-parser = "0.17"

# macOS: compile Metal shaders at runtime so builds don't need Xcode's
# separately downloaded Metal toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

# ---------------------------------------------------------------- packaging
# assets/oui.txt: IEEE MAC-vendor list; the release workflow refreshes it when it can.

[package.metadata.deb]
name = "network-analyser"
maintainer = "Vivek Vijayan"
section = "net"
priority = "optional"
extended-description = """\
Scans a network range and lists live devices with ping/TTL, hostnames \
(DNS, mDNS, NetBIOS, UPnP), MAC address and vendor, open TCP ports, service \
banners, HTTP titles and OS/device guesses. Also scans ports on remote \
domains and addresses, captures and analyses packets (libpcap), monitors \
serial ports, and acts as a Modbus RTU/TCP master with device discovery. \
Industrial and IoT tools: CAN bus (SocketCAN, slcan), PROFINET DCP, \
BACnet/IP, OPC UA, MQTT and WebSocket; service testers for SNMP, NTP, \
SSH/SFTP, DHCP and DNS. \
GPUI interface that runs fullscreen or as a locked kiosk on X11 and Wayland."""
# gpui dlopen()s Vulkan and the Wayland client libraries, so $auto can't see them.
depends = "$auto, iputils-ping | inetutils-ping, libvulkan1, libwayland-client0, libwayland-cursor0, libxkbcommon0, libxkbcommon-x11-0, libxcb1, libfontconfig1, libfreetype6"
recommends = "mesa-vulkan-drivers, curl"
assets = [
    ["target/release/network_analyser", "usr/bin/", "755"],
    ["assets/network-analyser.desktop", "usr/share/applications/", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/network-analyser.png", "644"],
    ["assets/oui.txt", "usr/share/network-analyser/oui.txt", "644"],
    ["README.md", "usr/share/doc/network-analyser/README.md", "644"],
    ["LICENSE", "usr/share/doc/network-analyser/copyright", "644"],
]

[package.metadata.generate-rpm]
name = "network-analyser"
summary = "LAN/port scanner, packet analyser, serial and Modbus tool with a fullscreen/kiosk GUI"
license = "MIT"
assets = [
    { source = "target/release/network_analyser", dest = "/usr/bin/network_analyser", mode = "755" },
    { source = "assets/network-analyser.desktop", dest = "/usr/share/applications/network-analyser.desktop", mode = "644" },
    { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/network-analyser.png", mode = "644" },
    { source = "assets/oui.txt", dest = "/usr/share/network-analyser/oui.txt", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/network-analyser/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/network-analyser/LICENSE", mode = "644" },
]

# Soname requirements work across Fedora, RHEL and openSUSE package names.
[package.metadata.generate-rpm.requires]
"libvulkan.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-cursor.so.0()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libfontconfig.so.1()(64bit)" = "*"
"libpcap.so.1()(64bit)" = "*"
"/usr/bin/ping" = "*"

[package]
name = "network_analyser"
version = "0.1.0"
edition = "2024"

[dependencies]
dns-lookup = "4.0.2"
futures = "0.3.34"
gpui = "0.2.2"
if-addrs = "0.15.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "time", "process", "sync", "io-util", "macros"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
